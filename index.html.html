const app=document.getElementById('app');
const total=DATA.reduce((n,s)=>n+s.q.length,0);
let list=[],i=0,res=[],picked=null,shuffleOn=false,lastSel=null;
const rom=['I','II','III','IV','V','VI','VII','VIII'];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let best={};try{best=JSON.parse(localStorage.getItem('rp-best')||'{}')}catch(e){}
function saveBest(k,v){try{if((best[k]||0)<v){best[k]=v;localStorage.setItem('rp-best',JSON.stringify(best))}}catch(e){}}
function shuf(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function home(){
  let h=`<div class="caps" style="text-align:center">Question Bank</div><div class="rule"><i></i><b></b><i></i></div>
  <h1>Removable<br>Prosthodontics</h1><div class="sub">Technology I · Online Quiz</div>
  <div class="me"><img src="${AVATAR}" alt=""><strong>Dr. Andrew Karam</strong><a class="pill" href="https://t.me/AmlrcwGRHDdlYTg8" target="_blank" rel="noopener">JOIN THE TELEGRAM GROUP</a></div>
  <div class="rule"><i></i><b></b><i></i></div>
  <label class="opt-row"><input type="checkbox" id="shuf" ${shuffleOn?'checked':''}> Shuffle questions</label>
  <div class="secs"><button class="sec" data-s="all"><div>All sections</div><span>${total} Q${best.all!=null?' · best '+best.all+'%':''}</span></button>`;
  DATA.forEach((s,k)=>{h+=`<button class="sec" data-s="${k}"><div><span style="margin-right:8px">${rom[k]}</span>${esc(s.t)}</div><span>${s.q.length} Q${best[k]!=null?' · '+best[k]+'%':''}</span></button>`});

}
function start(s,custom){
  curKey=s;
  let l=custom||(s==='all'?DATA.flatMap(x=>x.q):DATA[+s].q);
  list=shuffleOn?shuf(l):l;i=0;res=[];show();
}
let curKey='all';
function show(){
  const q=list[i];picked=null;
  let h=`<div class="top caps"><span>Question ${i+1} / ${list.length}</span><span>Score ${res.filter(r=>r.ok).length}</span></div>
  <div class="bar"><div style="width:${i/list.length*100}%"></div></div>
  <div class="q">${esc(q.t)}</div><div class="opts">`;
  q.o.forEach((o,k)=>{h+=`<button class="o" data-k="${k}"><b>${o[0].toUpperCase()}</b><span>${esc(o[1])}</span></button>`});
  h+=`</div><div id="fb"></div><div class="nav"><button class="btn" id="hm">Quit</button><button class="btn gold hide" id="nx">${i+1===list.length?'Finish':'Next'}</button></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  app.querySelectorAll('.o').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  document.getElementById('hm').onclick=home;
  document.getElementById('nx').onclick=next;
}
function answer(k){
  if(picked!==null)return;picked=k;const q=list[i];const ok=q.a.includes(k);
  res.push({q,k,ok});
  app.querySelectorAll('.o').forEach((b,j)=>{b.disabled=true;if(q.a.includes(j))b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  let f=`<div class="fb ${ok?'ok':'bad'}">${ok?'Correct ✓':'Not quite — the correct answer is highlighted.'}</div>`;
  if(q.n)f+=`<div class="note">${esc(q.n)}</div>`;
  document.getElementById('fb').innerHTML=f;
  document.getElementById('nx').classList.remove('hide');
}
function next(){if(i+1<list.length){i++;show()}else done()}
function done(){
  const c=res.filter(r=>r.ok).length,p=Math.round(c/list.length*100);

  let h=`<div class="caps" style="text-align:center">Your result</div><div class="score">${p}%</div>
  <div style="text-align:center;font-size:20px">${c} of ${list.length} correct</div>
  <div class="rule"><i></i><b></b><i></i></div>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn gold" id="again">Try again</button>${wrong.length?'<button class="btn" id="rw">Retry wrong ('+wrong.length+')</button>':''}<button class="btn" id="hm">Home</button></div>`;
  if(wrong.length){h+='<h3 style="margin-top:28px">Review your mistakes</h3>';wrong.forEach(r=>{h+=`<div class="rev"><p><b>${esc(r.q.t)}</b></p><p class="w">Your answer: ${r.q.o[r.k][0].toUpperCase()}. ${esc(r.q.o[r.k][1])}</p><p class="c">Correct: ${r.q.a.map(x=>r.q.o[x][0].toUpperCase()+'. '+esc(r.q.o[x][1])).join(' / ')}</p></div>`})}
  app.innerHTML=h;window.scrollTo(0,0);
  document.getElementById('again').onclick=()=>{window._custom=false;start(curKey)};
  const rw=document.getElementById('rw');if(rw)rw.onclick=()=>{window._custom=true;start(curKey,wrong.map(r=>r.q))};
  document.getElementById('hm').onclick=()=>{window._custom=false;home()};
}
document.addEventListener('keydown',e=>{
  if(!document.querySelector('.o'))return;
  const m='abcde'.indexOf(e.key.toLowerCase());
  if(m>=0&&m<list[i].o.length)answer(m);
  if((e.key==='Enter'||e.key==='ArrowRight')&&picked!==null)next();
});
home();
</script>
</body>
</html>
